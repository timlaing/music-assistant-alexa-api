name: Auto label pull requests
# Metadata-only: never check out or execute code from the PR branch.
on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited, ready_for_review]
permissions:
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: release-drafter/release-drafter/autolabeler@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
