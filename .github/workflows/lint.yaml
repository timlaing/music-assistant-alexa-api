name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 0 * * *"

jobs:
  find:
    name: Find add-ons
    runs-on: ubuntu-latest
    outputs:
      addons: ${{ steps.addons.outputs.addons_list }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      - name: 🔍 Find add-on directories
        id: addons
        uses: home-assistant/actions/helpers/find-addons@master

  lint:
    name: Lint add-on ${{ matrix.path }}
    runs-on: ubuntu-latest
    needs: find
    strategy:
      matrix:
        path: ${{ fromJson(needs.find.outputs.addons) }}
    steps:
      - name: ⤵️ Check out code from GitHub
        uses: actions/checkout@v7.0.1

      # v2.21.1 still rejects valid digest references. Extend only that regex;
      # run every other upstream schema and semantic check unchanged.
      - name: Check out pinned add-on linter
        uses: actions/checkout@v7.0.1
        with:
          repository: frenck/action-addon-linter
          ref: b9cfd1bc62ba60d2c4fc96317b5f7ada5923f4a7 # v2.21.1
          path: .addon-linter
      - name: Run digest-aware Home Assistant Add-on Lint
        env:
          ADDON_PATH: ${{ matrix.path }}
        run: |
          python3 scripts/allow_digest_images.py .addon-linter/src/build.schema.json
          docker build -t addon-linter .addon-linter/src
          docker run --rm -v "$PWD:/github/workspace:ro" -e INPUT_PATH="/github/workspace/$ADDON_PATH" -e INPUT_COMMUNITY=false addon-linter
