name: Runtime Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Resolve pinned image
        id: pin
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          base=$(ruby -ryaml -e "puts YAML.load_file('music-assistant-alexa-api/build.yaml')['build_from'][ENV['ARCH']]")
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # The container tests also run the skill's own test suite against the
          # shipped code; check it out at the release tag the image was built
          # from so the tests always match the baked-in application.
          ref="${base%@*}"
          echo "skill_ref=${ref##*:}" >> "$GITHUB_OUTPUT"
      # The two steps below check out and then *execute* the skill repo's test
      # suite, so the release tag parsed out of build.yaml has to be treated as
      # untrusted input: a moved, foreign or unsigned tag would otherwise run
      # arbitrary code on this runner. Verify the cosign signature on the
      # digest-pinned base image — signed keyless by the skill repo's release
      # workflow — before any of that code is checked out or run. This mirrors
      # the verification image.yaml already performs before building.
      - name: Install Cosign for base image verification
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6
      - name: Verify base image signature before running skill tests
        uses: home-assistant/builder/actions/cosign-verify@7412f0023ea9b6e58e8bb5059f1660f51376f49a # 2026.09.0
        with:
          image: ${{ steps.pin.outputs.base }}
          cosign-identity: https://github.com/timlaing/music-assistant-alexa-skill/.*
          cosign-issuer: https://token.actions.githubusercontent.com
          allow-failure: false
      - name: Check out skill tests at the pinned release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: timlaing/music-assistant-alexa-skill
          ref: ${{ steps.pin.outputs.skill_ref }}
          path: music-assistant-alexa-api/skill-api
          persist-credentials: false
      - name: Build pinned image
        env:
          PLATFORM: ${{ matrix.platform }}
          BASE: ${{ steps.pin.outputs.base }}
        run: |
          docker build --platform "$PLATFORM" --build-arg BUILD_FROM="$BASE" -t ma-alexa:test music-assistant-alexa-api
      - name: Test application and container lifecycle
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/test_container.sh ma-alexa:test "$PLATFORM"
