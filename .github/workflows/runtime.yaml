name: Runtime Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - name: Build pinned image
        env:
          ARCH: ${{ matrix.arch }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          base=$(ruby -ryaml -e "puts YAML.load_file('music-assistant-alexa-api/build.yaml')['build_from'][ENV['ARCH']]")
          tempio=$(ruby -ryaml -e "puts YAML.load_file('music-assistant-alexa-api/build.yaml')['args']['TEMPIO_VERSION']")
          docker build --platform "$PLATFORM" --build-arg BUILD_FROM="$base" --build-arg BUILD_ARCH="$ARCH" --build-arg TEMPIO_VERSION="$tempio" -t ma-alexa:test music-assistant-alexa-api
      - name: Test application and container lifecycle
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/test_container.sh ma-alexa:test "$PLATFORM"
