name: Runtime Tests

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Resolve pinned image
        id: pin
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          base=$(ruby -ryaml -e "puts YAML.load_file('music-assistant-alexa-api/build.yaml')['build_from'][ENV['ARCH']]")
          echo "base=$base" >> "$GITHUB_OUTPUT"
          # The container tests also run the skill's own test suite against the
          # shipped code; check it out at the release tag the image was built
          # from so the tests always match the baked-in application.
          ref="${base%@*}"
          echo "skill_ref=${ref##*:}" >> "$GITHUB_OUTPUT"
      - name: Check out skill tests at the pinned release tag
        uses: actions/checkout@v7.0.1
        with:
          repository: timlaing/music-assistant-alexa-skill
          ref: ${{ steps.pin.outputs.skill_ref }}
          path: music-assistant-alexa-api/skill-api
          persist-credentials: false
      - name: Build pinned image
        env:
          PLATFORM: ${{ matrix.platform }}
          BASE: ${{ steps.pin.outputs.base }}
        run: |
          docker build --platform "$PLATFORM" --build-arg BUILD_FROM="$BASE" -t ma-alexa:test music-assistant-alexa-api
      - name: Test application and container lifecycle
        env:
          PLATFORM: ${{ matrix.platform }}
        run: bash scripts/test_container.sh ma-alexa:test "$PLATFORM"
