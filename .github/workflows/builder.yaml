name: Builder

env:
  BUILD_ARGS: "--test"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Select changed add-on
        id: changed_addons
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            files=$(git ls-files)
          else
            files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          changed=false
          while IFS= read -r file; do
            case "$file" in
              music-assistant-alexa-api/build.yaml|music-assistant-alexa-api/config.yaml|music-assistant-alexa-api/Dockerfile|music-assistant-alexa-api/requirements.lock|music-assistant-alexa-api/gunicorn.conf.py|music-assistant-alexa-api/rootfs/*|music-assistant-alexa-api/scripts/*|music-assistant-alexa-api/skill-api|tests/*|scripts/*|.github/workflows/*|requirements-test.txt)
                changed=true ;;
            esac
          done <<< "$files"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo 'addons=["music-assistant-alexa-api"]' >> "$GITHUB_OUTPUT"
  runtime:
    needs: init
    if: needs.init.outputs.changed == 'true'
    uses: ./.github/workflows/runtime.yaml
    permissions:
      contents: read

  build:
    needs: [init, runtime]
    runs-on: ubuntu-latest
    if: needs.init.outputs.changed == 'true'
    name: Build ${{ matrix.arch }} ${{ matrix.addon }} add-on
    strategy:
      matrix:
        addon: ${{ fromJson(needs.init.outputs.changed_addons) }}
        arch: ["aarch64", "amd64"]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive

      - name: Get information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./${{ matrix.addon }}"

      - name: Check if add-on should be built
        id: check
        env:
          IMAGE: ${{ steps.info.outputs.image }}
          ARCHITECTURES: ${{ steps.info.outputs.architectures }}
          ARCH: ${{ matrix.arch }}
          ADDON: ${{ matrix.addon }}
          HEAD_REF: ${{ github.head_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$IMAGE" == "null" ]]; then
            echo "Image property is not defined, skipping build"
            echo "build_arch=false" >> "$GITHUB_OUTPUT"
          elif [[ "$ARCHITECTURES" =~ $ARCH ]]; then
            echo "build_arch=true" >> "$GITHUB_OUTPUT"
            echo "image=$(echo "$IMAGE" | cut -d'/' -f3)" >> "$GITHUB_OUTPUT"
            if [[ -z "$HEAD_REF" ]] && [[ "$EVENT_NAME" == "push" ]]; then
              echo "BUILD_ARGS=" >> "$GITHUB_ENV"
            fi
          else
            echo "$ARCH is not a valid arch for $ADDON, skipping build"
            echo "build_arch=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GitHub Container Registry
        if: env.BUILD_ARGS != '--test'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.addon }} add-on
        if: steps.check.outputs.build_arch == 'true'
        uses: home-assistant/builder@2026.09.0
        with:
          args: |
            ${{ env.BUILD_ARGS }} \
            --${{ matrix.arch }} \
            --target /data/${{ matrix.addon }} \
            --image "${{ steps.check.outputs.image }}" \
            --docker-hub "ghcr.io/${{ github.repository_owner }}" \
            --addon
