name: Builder

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Select changed add-on
        id: changed_addons
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            files=$(git ls-files)
          else
            files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          changed=false
          while IFS= read -r file; do
            case "$file" in
              music-assistant-alexa-api/build.yaml|music-assistant-alexa-api/config.yaml|music-assistant-alexa-api/Dockerfile|music-assistant-alexa-api/requirements.lock|music-assistant-alexa-api/gunicorn.conf.py|music-assistant-alexa-api/rootfs/*|music-assistant-alexa-api/scripts/*|music-assistant-alexa-api/skill-api|tests/*|scripts/*|.github/workflows/*|requirements-test.txt)
                changed=true ;;
            esac
          done <<< "$files"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo 'addons=["music-assistant-alexa-api"]' >> "$GITHUB_OUTPUT"
  runtime:
    needs: init
    if: needs.init.outputs.changed == 'true'
    uses: ./.github/workflows/runtime.yaml
    permissions:
      contents: read

  build:
    needs: [init, runtime]
    if: needs.init.outputs.changed == 'true'
    name: Build ${{ matrix.arch }} add-on
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: aarch64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
      - name: Read pinned build settings
        id: settings
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          ruby -ryaml -e '
            build = YAML.load_file("music-assistant-alexa-api/build.yaml")
            config = YAML.load_file("music-assistant-alexa-api/config.yaml")
            puts "version=#{config["version"]}"
            puts "base=#{build["build_from"][ENV["ARCH"]]}"
            puts "tempio=#{build["args"]["TEMPIO_VERSION"]}"
            puts "labels<<EOF"
            puts "io.hass.type=addon"
            puts "io.hass.name=#{config["name"]}"
            puts "io.hass.description=#{config["description"]}"
            build["labels"].each { |key, value| puts "#{key}=#{value}" }
            puts "EOF"
          ' >> "$GITHUB_OUTPUT"
      - name: Build and optionally publish add-on
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: music-assistant-alexa-api
          image: ghcr.io/timlaing/${{ matrix.arch }}-addon-ma-alexa-api
          image-tags: ${{ steps.settings.outputs.version }}
          version: ${{ steps.settings.outputs.version }}
          labels: ${{ steps.settings.outputs.labels }}
          skip-existing: ${{ steps.settings.outputs.version }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          cosign-base-verify: ${{ steps.settings.outputs.base }}
          cosign-base-identity: https://github.com/home-assistant/docker-base/.*
          build-args: |
            BUILD_FROM=${{ steps.settings.outputs.base }}
            TEMPIO_VERSION=${{ steps.settings.outputs.tempio }}
