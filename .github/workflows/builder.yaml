name: Builder

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  init:
    runs-on: ubuntu-latest
    name: Initialize builds
    outputs:
      changed_addons: ${{ steps.changed_addons.outputs.addons }}
      changed: ${{ steps.changed_addons.outputs.changed }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select changed add-on
        id: changed_addons
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            files=$(git ls-files)
          else
            files=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          fi
          changed=false
          while IFS= read -r file; do
            case "$file" in
              music-assistant-alexa-api/.dockerignore|music-assistant-alexa-api/build.yaml|music-assistant-alexa-api/config.yaml|music-assistant-alexa-api/Dockerfile|music-assistant-alexa-api/requirements.lock|music-assistant-alexa-api/gunicorn.conf.py|music-assistant-alexa-api/rootfs/*|music-assistant-alexa-api/scripts/*|music-assistant-alexa-api/skill-api|tests/*|scripts/*|.github/workflows/*|requirements-test.txt|requirements_all.txt)
                changed=true ;;
            esac
          done <<< "$files"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo 'addons=["music-assistant-alexa-api"]' >> "$GITHUB_OUTPUT"
  runtime:
    needs: init
    if: needs.init.outputs.changed == 'true'
    uses: ./.github/workflows/runtime.yaml
    permissions:
      contents: read

  build:
    needs: [init, runtime]
    if: needs.init.outputs.changed == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/image.yaml
    permissions:
      contents: read
    with:
      publish: false

  publish:
    needs: [init, runtime]
    if: needs.init.outputs.changed == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/image.yaml
    permissions:
      contents: read
      packages: write
      id-token: write
    with:
      publish: true
