name: Close stale issues
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
permissions:
  actions: write # Save/resume the stale action processing cache.
  contents: read
  issues: write
jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - name: Mark and close stale issues
        uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: stale
          stale-issue-message: |
            This issue has had no activity for 60 days and is now marked stale.
            If it remains relevant, please comment with results from the latest
            stable version, reproduction steps and relevant logs (redact secrets).
            It will close after another 14 days without activity.
          close-issue-message: |
            Closing due to inactivity, rather than a confirmed fix. If this
            remains relevant on the latest stable version, please reopen it or
            create a new issue referencing this one with updated details.
          close-issue-reason: not_planned
          exempt-issue-labels: pinned,security,roadmap
          days-before-pr-stale: -1
          days-before-pr-close: -1
          remove-stale-when-updated: true
          operations-per-run: 100
