# https://developers.home-assistant.io/docs/add-ons/configuration#add-on-config
name: Music Assistant Alexa API add-on
version: "1.3.0-beta.2"
slug: ma_alexa_api
description: Music Assistant Alexa API add-on
url: "https://github.com/timlaing/music-assistant-alexa-api/tree/main/music-assistant-alexa-api"
arch:
  - aarch64
  - amd64
init: false
# Migration-only compatibility: edit application settings in ingress Setup.
# Preserve legacy values through the first migration release.
options:
  ma_hostname: ""
  skill_hostname: ""
  api_username: "ma-local-alexa-api"
  locale: "en-US"
  skip_url_validation: false
  ma_api_url: ""
  enable_apl: false
schema:
  ma_hostname: "str"
  skill_hostname: "str?"
  api_username: "str"
  api_password: "password?"
  locale: "str"
  skip_url_validation: "bool"
  ma_api_url: "str?"
  ma_api_token: "password?"
  enable_apl: "bool"
  lwa_client_id: "str?"
  lwa_client_secret: "password?"
  skill_certificate_type: "list(Trusted|Wildcard)?"
image: "ghcr.io/timlaing/{arch}-addon-ma-alexa-api"
ingress: true
ingress_entry: status
panel_icon: mdi:music
homeassistant: 2025.12.5
ports:
  5000/tcp: 5000
ports_description:
  5000/tcp: "The API port"
