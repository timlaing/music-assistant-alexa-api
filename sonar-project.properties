sonar.projectKey=timlaing_music-assistant-alexa-api
sonar.organization=timlaing
sonar.sources=music-assistant-alexa-api,scripts,.github/workflows
sonar.tests=tests
# skill-api/ is a local gitignored checkout of the skill repo; never present in CI.
sonar.exclusions=**/skill-api/**
sonar.python.coverage.reportPaths=coverage.xml
# gunicorn.conf.py is runtime container config: only executed by gunicorn in
# the image, never by host pytest, so it can never have coverage.
sonar.coverage.exclusions=**/gunicorn.conf.py
# This is the name and version displayed in the SonarCloud UI.
sonar.projectName=music-assistant-alexa-api
sonar.python.version=3.14
