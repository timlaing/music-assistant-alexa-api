# Custom locations for the Music Assistant Alexa API add-on.
#
# Installed at /share/nginx_proxy_default.conf and included inside the HTTPS
# server block of the NGINX Home Assistant SSL proxy add-on
# (customize.active: true). Home Assistant itself remains the default route
# via the add-on template's location /.
#
# Replace:
#   <HA_LAN_IP>  Home Assistant host LAN IP (add-on publishes port 5000)
#   <MA_LAN_IP>  Music Assistant host LAN IP (stream port 8097)

# Skill endpoint + Amazon OAuth callback: the /ma-alexa-skill/ prefix is
# STRIPPED (trailing slash on proxy_pass), reaching the add-on at its root.
location /ma-alexa-skill/ {
    proxy_pass http://<HA_LAN_IP>:5000/;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
}

# Music Assistant Alexa provider API: full path PRESERVED (no URI on
# proxy_pass), including /alexa/intents and /ma/push-url. These endpoints
# use the add-on's own Basic Auth - do not add any proxy auth or access list
# here, or MA cannot reach them.
location /alexa/ {
    proxy_pass http://<HA_LAN_IP>:5000;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
}

location /ma/ {
    proxy_pass http://<HA_LAN_IP>:5000;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;
}

# Music Assistant stream routes: full path PRESERVED (no URI on proxy_pass).
# No proxy_buffering directive needed - the server block already has it off.
location ~ ^/(flow|pluginsource|source|announcement|imageproxy)/ {
    proxy_pass http://<MA_LAN_IP>:8097;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}
