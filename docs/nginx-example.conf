# Example nginx configuration for the Music Assistant Alexa API add-on.
#
# This is a standalone nginx install. If you use the NGINX Home Assistant
# SSL proxy add-on instead, see docs/nginx-ha-ssl-proxy/ for the add-on-based
# equivalent of this configuration.
#
# This is the plain-nginx equivalent of the Nginx Proxy Manager custom
# locations documented in the add-on README. It serves both public HTTPS
# endpoints Alexa needs from one shared hostname:
#
#   /ma-alexa-skill/  -> add-on :5000   (skill endpoint + Amazon OAuth callback)
#   /flow/            -> MA :8097       (queue flow streams)
#   /pluginsource/    -> MA :8097       (plugin audio)
#   /source/          -> MA :8097       (live sources, e.g. iPhone/AirPlay)
#   /announcement/    -> MA :8097       (announcement audio)
#   /imageproxy/      -> MA :8097       (artwork)
#   /alexa/, /ma/     -> add-on :5000   (only if MA's provider API URL is public)
#
# Replace before use:
#   music.example.com   public hostname (publicly trusted TLS certificate)
#   192.168.1.10        LAN host running the add-on (internal port 5000)
#   192.168.1.20        LAN host running Music Assistant (stream port 8097)
#
# Requirements:
#   - TLS 1.2+ with a publicly trusted certificate; Alexa rejects self-signed.
#   - The /ma-alexa-skill/ route must accept signed Alexa POSTs and the Amazon
#     OAuth callback without any proxy auth, access list or login page.
#   - Do not forward add-on port 5000 or MA port 8097 directly to the internet.

upstream ma_alexa_addon {
    server 192.168.1.10:5000;
    keepalive 8;
}

upstream ma_streams {
    server 192.168.1.20:8097;
    keepalive 8;
}

server {
    listen 443 ssl;
    http2 on;
    server_name music.example.com;

    ssl_certificate     /etc/letsencrypt/live/music.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/music.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Shared proxy headers for every upstream.
    # (In nginx < 1.25.2, drop "http2 on;" and use "listen 443 ssl http2;".)

    # Skill endpoint and Amazon setup callback. The /ma-alexa-skill/ prefix is
    # stripped: Alexa and the OAuth callback reach the add-on at its root.
    location /ma-alexa-skill/ {
        proxy_pass http://ma_alexa_addon/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Music Assistant stream routes. proxy_pass has no URI part, so the full
    # path is preserved. Buffering stays off so flow streams play live instead
    # of being cached; long read/send timeouts cover full-length tracks.
    # Alexa probes streams with HEAD before GET; nginx handles both.
    location ~ ^/(flow|pluginsource|source|announcement|imageproxy)/ {
        proxy_pass http://ma_streams;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 10s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }

    # Only needed when Music Assistant's Alexa provider API URL points at this
    # public hostname instead of the add-on's LAN address
    # (http://<HA-LAN-IP>:5000). Paths are preserved, including
    # /ma/push-url and /alexa/intents. Do not add auth to these locations.
    location /alexa/ {
        proxy_pass http://ma_alexa_addon;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /ma/ {
        proxy_pass http://ma_alexa_addon;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Anything else is not proxied publicly; /status and /setup are served
    # through Home Assistant ingress and need no public location.
    location / {
        return 404;
    }
}

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    server_name music.example.com;
    return 301 https://$host$request_uri;
}

