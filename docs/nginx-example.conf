# Alternative: split hostnames instead of one shared host.
# With a dedicated streams hostname forwarding ALL paths to 8097, the stream
# locations above are unnecessary:
#
#   server {
#       listen 443 ssl;
#       server_name streams.example.com;
#       ssl_certificate     /etc/letsencrypt/live/streams.example.com/fullchain.pem;
#       ssl_certificate_key /etc/letsencrypt/live/streams.example.com/privkey.pem;
#       location / {
#           proxy_pass http://ma_streams;
#           proxy_http_version 1.1;
#           proxy_set_header Host $host;
#           proxy_set_header X-Real-IP $remote_addr;
#           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#           proxy_set_header X-Forwarded-Proto $scheme;
#           proxy_set_header Connection "";
#           proxy_buffering off;
#           proxy_read_timeout 3600s;
#       }
#   }
#
# Then set the add-on's "Music Assistant Hostname" to streams.example.com and
# the skill endpoint stays https://alexa.example.com/ma-alexa-skill/ (a second
# server block forwarding all paths to the add-on, keeping the /ma-alexa-skill/
# strip rule for the Amazon callback).
# ---------------------------------------------------------------------------
